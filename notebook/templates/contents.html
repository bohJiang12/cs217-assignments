<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
  <script>
    function toggleCommentBox() {
        let commentBox = document.getElementById("comment-box");
        let submitButton = document.getElementById("submit-comment");

        if (commentBox.style.display === "none") {
            commentBox.style.display = "block";
            submitButton.style.display = "block";
        } else {
            commentBox.style.display = "none";
            submitButton.style.display = "none";
        }
    }

    function submitComment(noteId) {
        let commentText = document.getElementById("comment-text").value.trim();

        if (!commentText) {
            alert("Comment cannot be empty!");
            return;
        }

        let xhr = new XMLHttpRequest();
        xhr.open("POST", window.location.pathname, true);
        xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

        xhr.onload = function () {
            if (xhr.status === 200) {
                let response = JSON.parse(xhr.responseText);
                
        
                let noCommentsMsg = document.getElementById("no-comments-msg");
                if (noCommentsMsg) {
                    noCommentsMsg.style.display = "none";
                }

        
                addCommentToList(response.comment_text, response.comment_date);

        
                document.getElementById("comment-text").value = "";
                document.getElementById("comment-box").style.display = "none";
            } else {
                alert("Failed to add comment.");
            }
        };

        xhr.send("text=" + encodeURIComponent(commentText) + "&note_id=" + encodeURIComponent(noteId));
    }

    function addCommentToList(text, date) {
        let commentsList = document.getElementById("comments-list");

        let newComment = document.createElement("li");
        newComment.innerHTML = `<b>${date}</b>: ${text}`;
        commentsList.appendChild(newComment);
    }
    
    function deleteNote(noteId) {
        if (!confirm("Are you sure you want to delete this note?")) {
            return;
        }

        let xhr = new XMLHttpRequest();
        xhr.open("DELETE", window.location.pathname, true);

        xhr.onload = function () {
            if (xhr.status === 200) {
                alert("Note deleted successfully!");
                window.location.href = "/";  
            } else {
                alert("Failed to delete note.");
            }
        };

        xhr.send();
    }
  </script>
</head>

<body>

  <h1>{{ note_name }}</h1>
  <p>{{ note_text }}</p>

  <h2>Comments</h2>
  <ul id="comments-list">
    {% for comment in comments %}
      <li><b>{{ comment.date }}</b>: {{ comment.text }}</li>
    {% else %}
      <p id="no-comments-msg">No comments yet. Be the first to comment!</p>
    {% endfor %}
  </ul>

  <button onclick="toggleCommentBox()">Add Comment</button>
  <button onclick="deleteNote('{{ note_id }}')" style="color: red;">Delete Note</button>

  <!-- Hidden comment box -->
  <div id="comment-box" style="display: none; margin-left: 20px;">
    <textarea id="comment-text" rows="3" cols="50" placeholder="Enter your comment..."></textarea>
    <br>
    <button id="submit-comment" style="display: none;" onclick="submitComment('{{ note_id }}')">Submit</button>
  </div>

  <br>
  <a href="/">Back to Notebook</a>

</body>

</html>
