<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
</head>

<body>
    <h1>Notebook</h1>

    <!-- Search Term -->
    <label for="search">Search term:</label>
    <input type="text" id="search-term"/>
    <button onclick="searchNotes()">Search</button>
    <button onclick="clearSearch()">Clear Search</button>

    <!-- Notes List (Rendered Initially by Flask) -->
    <h2>All Notes</h2>
    <ul id="notes-list">
        {% for note in notes %}
            <li><a href="/{{ note.name }}">{{ note.name }}</a></li>
        {% endfor %}
    </ul>

    <!-- Clear notebook button -->
    <button onclick="clearNotes()" style="color: red;">Clear All Notes</button>
    
    <!-- Add New Note Form -->
    <h2>
        <form id="add-note-form" method="POST">
            <label for="title"></label>
            <textarea id="title" name="title" rows="1" cols="50" placeholder="Enter note title"></textarea>
            <br>
            <label for="content"></label>
            <textarea id="content" name="content" rows="10" cols="50" placeholder="Enter contents" required></textarea>
            <br>
            <button type="submit">Add Note</button>  <!-- Use normal form submit -->
        </form>
    </h2>

    <script>
        function searchNotes(){
            let searchInput = document.getElementById("search-term");
            let searchTerm = searchInput.value.trim();

            if (!searchTerm){
                window.location.href = "/";
                return;
            }

            let xhr = new XMLHttpRequest();
            xhr.open("POST", "/", true);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            xhr.onload = function(){
                if (xhr.status == 200){
                    let parser = new DOMParser();
                    let doc = parser.parseFromString(xhr.responseText, 'text/html');
                    let newNotesList = doc.getElementById("notes-list").innerHTML;
                    document.getElementById("notes-list").innerHTML = newNotesList;

                    searchInput.value = "";
                } else {
                    console.error("Search failed.");
                }
            };

            xhr.onerror = function(){
                console.error("Request failed.");
            };

            xhr.send("search_term=" + encodeURIComponent(searchTerm));
        }

        function clearSearch(){
            window.location.href = "/";
        }

	function clearNotes() {
            if (!confirm("Are you sure you want to clear all notes? This action cannot be undone.")) {
                return;
            }

            let xhr = new XMLHttpRequest();
            xhr.open("DELETE", "/", true);

            xhr.onload = function () {
                if (xhr.status === 200) {
                    alert("All notes have been cleared.");
                    location.reload();
                } else {
                    alert("Failed to clear notes.");
                }
            };

            xhr.send();
        }
    </script>
</body>

</html>
